<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>АгроАвангард — контакты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one mobile card — olive brand header, then a stack of large action buttons on beige. Single committed brand look (no dark variant). */
:root{
  --olive:#4A502E; --olive-deep:#3B4024; --beige:#F2EBDA; --paper:#FBF8F0;
  --ink:#232A17; --muted:#5C6150; --line:#D8CFB8; --orange:#E8762B; --sage:#C9CBB2;
  --font:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{background:var(--beige)}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 32px}
.card{max-width:440px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.head{position:relative;overflow:hidden;background:var(--olive);color:var(--beige);border-radius:20px;padding:24px 22px 26px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg.mark{width:44px;height:auto;flex:none}
.brand b{display:block;font-size:20px;font-weight:600;letter-spacing:.01em}
.brand small{display:block;font-size:clamp(8px, 2.6vw, 10px);font-weight:500;letter-spacing:.06em;white-space:nowrap;color:var(--sage);margin-top:2px}
.who h1{margin:0;font-size:26px;line-height:1.15;font-weight:600;text-wrap:balance}
.who p{margin:6px 0 0;font-size:15px;color:var(--sage)}
.rule{display:flex;align-items:center;gap:6px}
.rule i{display:block;height:1px;width:72px;background:#7D8462}
.rule svg{width:10px;height:10px}
.deco{position:absolute;right:-18px;bottom:-14px;width:130px;opacity:.35;pointer-events:none}
.topbar{display:flex;justify-content:flex-end;margin-bottom:-8px}
.lang{display:flex;border:1px solid var(--line);background:var(--paper);border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;font-size:13px;font-weight:600;padding:7px 14px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--olive);color:var(--beige)}
.lang button:focus-visible{outline:2px solid var(--orange);outline-offset:-2px}
.actions{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;gap:14px;min-height:62px;padding:12px 16px;border-radius:16px;background:var(--paper);border:1px solid var(--line);color:var(--ink);text-decoration:none;transition:transform .12s ease, background .12s ease}
.btn:active{transform:scale(.985);background:#fff}
.btn:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.btn .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--olive)}
.btn .ic svg{width:22px;height:22px;fill:var(--beige)}
.btn .tx{display:flex;flex-direction:column;min-width:0}
.btn .tx b{font-size:16px;font-weight:600}
.btn .tx span{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.btn .go{margin-left:auto;color:var(--muted);font-size:20px;line-height:1}
.btn.save{background:var(--olive);border-color:var(--olive);color:var(--beige)}
.btn.save .ic{background:var(--orange)}
.btn.save .tx span{color:var(--sage)}
.btn.save .go{color:var(--sage)}
.foot{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}
.team{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.team h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.team-list{display:flex;flex-direction:column;gap:8px}
.mate{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;border:1px dashed var(--line);color:var(--ink);text-decoration:none;background:transparent}
.mate:active{background:var(--paper)}
.mate:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.mate .av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px solid var(--olive);color:var(--olive);font-size:13px;font-weight:600}
.mate .tx{display:flex;flex-direction:column;min-width:0}
.mate .tx b{font-size:14.5px;font-weight:600}
.mate .tx span{font-size:12.5px;color:var(--muted)}
.mate .go{margin-left:auto;color:var(--muted);font-size:18px}
@media (prefers-reduced-motion: reduce){.btn{transition:none}}
</style>
</head>

      <button type="button" id="lang-ru" aria-pressed="true">RU</button>
      <button type="button" id="lang-en" aria-pressed="false">EN</button>
    </div>
  </div>

<script>
const EMAIL = 'agroavangards@gmail.com';
const P = {
  eduard:  {phone:'+375 29 351 49 65', ru:{name:'Куделько Эдуард Владимирович', title:'Заместитель директора по производству'}, en:{name:'Eduard Kudelko', title:'Deputy Director for Production'}},
  svetlana:{phone:'+375 29 678 91 47', ru:{name:'Куделько Светлана Николаевна', title:'Научный консультант'}, en:{name:'Svetlana Kudelko', title:'Scientific Consultant'}},
  igor:    {phone:'+375 29 107 06 48', ru:{name:'Найдун Игорь Иванович', title:'Заместитель директора по сбыту'}, en:{name:'Igor Naidun', title:'Deputy Director for Sales'}}
};
const T = {
  ru:{brand:'АгроАвангард', sub:'НАУЧНО-ПРОИЗВОДСТВЕННЫЙ ЦЕНТР', call:'Позвонить', chat:'Написать или позвонить', mail:'Написать на почту', save:'Сохранить контакт', saveSub:'Добавить в «Контакты» телефона', legal:'ООО НПЦ «АгроАвангард»', foot:'Беларусь', team:'Другие сотрудники'},
  en:{brand:'AgroAvangard', sub:'SCIENTIFIC AND PRODUCTION CENTER', call:'Call', chat:'Message or call', mail:'Send an e-mail', save:'Save contact', saveSub:'Add to your phone contacts', legal:'Agroavangard LLC', foot:'Belarus', team:'Other contacts'}
};
let person = 'eduard', lang = 'ru';
function parseHash(){
  const h = (location.hash || '').slice(1).toLowerCase();
  const m = h.match(/^(eduard|svetlana|igor)(-en)?$/);
  if (m){ person = m[1]; lang = m[2] ? 'en' : 'ru'; }
}
function render(){
  const p = P[person], d = p[lang], t = T[lang], digits = p.phone.replace(/\D/g,'');
  document.documentElement.lang = lang;
  document.getElementById('brand').textContent = t.brand;
  document.getElementById('sub').textContent = t.sub;
  document.getElementById('name').textContent = d.name;
  document.getElementById('title').textContent = d.title;
  document.getElementById('legal').textContent = t.legal;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t[el.dataset.t]);
  document.getElementById('v-tel').textContent = p.phone;
  document.getElementById('v-mail').textContent = EMAIL;
  document.getElementById('a-tel').href = 'tel:+' + digits;
  document.getElementById('a-tg').href = 'https://t.me/+' + digits;
  document.getElementById('a-wa').href = 'https://wa.me/' + digits;
  document.getElementById('a-vb').href = 'viber://chat?number=%2B' + digits;
  document.getElementById('a-mail').href = 'mailto:' + EMAIL;
  document.getElementById('lang-ru').setAttribute('aria-pressed', lang === 'ru');
  document.getElementById('lang-en').setAttribute('aria-pressed', lang === 'en');
  const team = document.getElementById('team'); team.innerHTML = '';
  Object.keys(P).filter(k => k !== person).forEach(k => {
    const m = P[k][lang], a = document.createElement('a');
    a.className = 'mate'; a.href = '#' + k + (lang === 'en' ? '-en' : '');
    const ini = m.name.split(' ').slice(0, 2).map(w => w[0]).join('');
    a.innerHTML = '<span class="av"></span><span class="tx"><b></b><span></span></span><span class="go" aria-hidden="true">›</span>';
    a.querySelector('.av').textContent = ini; a.querySelector('b').textContent = m.name; a.querySelector('.tx span').textContent = m.title;
    team.appendChild(a);
  });
  document.title = (lang === 'ru' ? 'АгроАвангард — ' : 'AgroAvangard — ') + d.name;
}
document.getElementById('lang-ru').onclick = () => { lang = 'ru'; render(); };
document.getElementById('lang-en').onclick = () => { lang = 'en'; render(); };
window.addEventListener('hashchange', () => { parseHash(); render(); window.scrollTo({top:0, behavior:'smooth'}); });
parseHash(); render();
</script>
